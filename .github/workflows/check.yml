name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py --check
      - run: python -m pip install pytest PySide6
      - name: Test if the SlideMage host API is available
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if python -c "import slidemage.plugin_api"; then
            python -m pytest -q
          else
            echo "::warning::Tests skipped: the SlideMage host API is not installed on this runner."
          fi
